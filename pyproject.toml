[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-narrative-world"
version = "0.2.0"
description = "Multi-user narrative game engine and creator platform with Content Pack v2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=11.0",
    "packaging>=24.0",
    "sentry-sdk[fastapi]>=2.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
redis = ["redis>=5.0"]
object-store = ["boto3>=1.35"]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
narrative = "apps.author_cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "database*", "apps*", "prompts*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
prompts = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that touch the database",
    "postgres_integration: tests PostgreSQL-specific migrations and RLS",
    "llm_contract: deterministic engine contracts around untrusted LLM proposals",
    "live_llm: opt-in evaluation that calls a configured external model",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["database/migrations/versions", "apps/web-next/node_modules", "apps/web-next/.next"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "RUF001", "RUF002", "RUF003",  # CJK punctuation is intentional in content-facing text
    "SIM108", # ternaries are not always clearer than if/else
    "UP047",  # TypeVar generics read better here than PEP 695 syntax
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["database/migrations/", "tests/"]
