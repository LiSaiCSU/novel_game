[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-narrative-world"
version = "0.1.0"
description = "AI-native open world text RPG engine (content pack: cultivation_v1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
redis = ["redis>=5.0"]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
packages = ["engine", "database", "apps", "prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "llm: tests that require a real LLM provider (skipped by default)",
    "integration: tests that touch the database",
    "eval: AI behaviour evaluations",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "RUF001", "RUF002", "RUF003",  # CJK punctuation is intentional in content-facing text
    "SIM108", # ternaries are not always clearer than if/else
    "UP047",  # TypeVar generics read better here than PEP 695 syntax
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["database/migrations/", "tests/"]
