skills:
  - key: basic_qi_palm
    name: 引气掌
    category: attack
    required_realm: qi_refining
    required_stage: early
    spiritual_cost: 8
    cooldown_minutes: 1
    power: 10
    description: 最基础的灵力外放，打在人身上像被木棍抽了一下。
    effects: {damage_type: blunt}

  - key: azure_cloud_sword_art
    name: 青云剑诀
    category: attack
    required_realm: qi_refining
    required_stage: late
    spiritual_cost: 30
    cooldown_minutes: 2
    power: 38
