# 事件模板。World Simulator（LOD 1-3）与 Director 都从这里取事件骨架。
# 引擎只认识 {key, scope, weight, requires, effects, narrative_hint}。

event_types:
  # 玩家行动产生的事件
  - {key: MOVE, importance: 0.05, visibility: LOCAL}
  - {key: CONVERSATION, importance: 0.10, visibility: LOCAL}
  - {key: TRADE, importance: 0.10, visibility: LOCAL}
  - {key: CULTIVATION_SESSION, importance: 0.08, visibility: PRIVATE}
  - {key: BREAKTHROUGH, importance: 0.80, visibility: LOCAL}
  - {key: BREAKTHROUGH_FAILED, importance: 0.60, visibility: PRIVATE}
  - {key: COMBAT_VICTORY, importance: 0.70, visibility: LOCAL}
  - {key: COMBAT_DEFEAT, importance: 0.70, visibility: LOCAL}
  - {key: DEATH, importance: 1.00, visibility: PUBLIC}
  - {key: RESCUE, importance: 0.90, visibility: LOCAL}
  - {key: BETRAYAL, importance: 0.95, visibility: PRIVATE}
  - {key: PROMISE, importance: 0.55, visibility: PRIVATE}
  - {key: SECRET_DISCLOSURE, importance: 0.85, visibility: PRIVATE}
  - {key: THEFT, importance: 0.55, visibility: SECRET}
  - {key: ITEM_ACQUIRED, importance: 0.15, visibility: PRIVATE}
  - {key: SKILL_LEARNED, importance: 0.35, visibility: PRIVATE}
  - {key: QUEST_ACCEPTED, importance: 0.25, visibility: LOCAL}
  - {key: QUEST_COMPLETED, importance: 0.55, visibility: LOCAL}
  - {key: QUEST_FAILED, importance: 0.50, visibility: LOCAL}
  - {key: RELATIONSHIP_SHIFT, importance: 0.20, visibility: PRIVATE}
  - {key: REJECTED_ACTION, importance: 0.02, visibility: PRIVATE}
  - {key: OBSERVATION, importance: 0.05, visibility: PRIVATE}
  # Director / 模拟器产生的事件
  - {key: NPC_RETURN, importance: 0.50, visibility: LOCAL}
  - {key: NPC_DEPARTURE, importance: 0.35, visibility: LOCAL}
  - {key: NPC_APPROACH, importance: 0.35, visibility: LOCAL}
  - {key: RUMOR_SPREAD, importance: 0.25, visibility: PUBLIC}
  - {key: FACTION_MOVE, importance: 0.55, visibility: FACTION}
  - {key: QUEST_OFFER, importance: 0.30, visibility: LOCAL}
  - {key: AMBUSH, importance: 0.75, visibility: LOCAL}
  - {key: DISCOVERY, importance: 0.55, visibility: PRIVATE}
  - {key: ENVIRONMENT_SHIFT, importance: 0.40, visibility: PUBLIC}
  - {key: CONFRONTATION, importance: 0.65, visibility: LOCAL}
  - {key: RESOURCE_CHANGE, importance: 0.30, visibility: FACTION}
  - {key: FORESHADOWING, importance: 0.20, visibility: LOCAL}
  - {key: OFFLINE_WORLD_EVENT, importance: 0.30, visibility: PUBLIC}
  - {key: SCHEDULE_MOVE, importance: 0.02, visibility: LOCAL}

# LOD 1/2/3 离线事件模板：玩家不在场时世界仍然发生的事
offline_templates:
  - key: sect_resource_shift
    lod: [2, 3]
    weight: 20
    scope: faction
    requires: {faction_any: true}
    effects:
      faction_resources: {spirit_stones: [-0.02, 0.03]}
    narrative_hint: 宗门资源出现波动

  - key: minor_beast_attack
    lod: [1, 2]
    weight: 15
    scope: location
    requires: {location_danger_min: 3}
    effects:
      location_flag: {beast_activity: true}
      tension: 2
    narrative_hint: 山中妖兽伤人

  - key: disciple_breakthrough
    lod: [1, 2]
    weight: 12
    scope: character
    requires: {character_type: [BACKGROUND, MINOR_NPC], realm_progress_min: 0.9}
    effects:
      character_breakthrough_attempt: true
    narrative_hint: 有人突破了

  - key: market_price_swing
    lod: [2]
    weight: 18
    scope: location
    requires: {location_type: [city, building]}
    effects:
      economy_modifier: [-0.15, 0.15]
    narrative_hint: 坊市物价波动

  - key: faction_friction
    lod: [2, 3]
    weight: 10
    scope: faction_pair
    requires: {enemies: true}
    effects:
      faction_relation: [-4, -1]
      tension: 3
    narrative_hint: 两家势力摩擦加剧

  - key: rumor_drift
    lod: [1, 2]
    weight: 25
    scope: information
    requires: {has_public_facts: true}
    effects:
      spread_information: true
    narrative_hint: 传言扩散

  - key: quest_taken_by_other
    lod: [1, 2]
    weight: 14
    scope: quest
    requires: {quest_status: offered, expired_or_stale: true}
    effects:
      reassign_quest: true
    narrative_hint: 别人接了那个任务

  - key: npc_travel
    lod: [1, 2]
    weight: 22
    scope: character
    requires: {character_type: [MINOR_NPC, MAJOR_NPC]}
    effects:
      move_along_schedule: true
    narrative_hint: 人在走动

  - key: sect_tournament
    lod: [2, 3]
    weight: 4
    scope: faction
    requires: {faction: qingyun_sect, min_days_since_last: 180}
    effects:
      tournament: true
      tension: 5
    narrative_hint: 宗门大比举行，无论玩家是否参加

  - key: distant_war_news
    lod: [3]
    weight: 6
    scope: world
    requires: {}
    effects:
      tension: 2
      spread_information: true
    narrative_hint: 远方传来战事消息
