# 确定性叙事模板：LLM 不可用或调用失败时使用（DECISIONS D-007）。
# 引擎本身不含任何中文字面量，所有措辞都在这里。
# 占位符由 TemplateRenderer 填充，缺失的占位符会被安全地留空。

# NPC 上下文中表达"相信的程度"的措辞。
# 注意：这里只表达该 NPC 的主观确信度，绝不表达客观真假。
npc_goal_action:
  succeeded: "{character}推进了计划：{step}"
  failed: "{character}尝试推进计划但尚未成功：{step}"

knowledge_hedges:
  KNOWN: "我确知："
  BELIEVED: "我相信："
  SUSPECTED: "我怀疑："
  HEARD: "我听说过："
  DISBELIEVED: "我不相信这种说法："

labels:
  list_separator: "、"
  time_prefix: ""
  location_prefix: "你在"
  unknown: "不明"
  none: "无"
  present_prefix: "在场："
  nobody_here: "此处只有你一人。"
  degraded_notice: "（叙事降级：本回合由模板生成）"

rejection:
  header: "你没能这么做。"
  by_reason_code:
    REALM_TOO_LOW: "你的修为还不足以做到这件事。"
    SKILL_NOT_LEARNED: "你并未修习过这门功法。"
    SKILL_ON_COOLDOWN: "刚才那一式的余韵还未散尽，此刻催动不起来。"
    INSUFFICIENT_SPIRITUAL_POWER: "丹田空空，灵力不够。"
    INSUFFICIENT_HEALTH: "身上的伤让你连站稳都费力。"
    ITEM_NOT_OWNED: "你身上并没有这样东西。"
    ITEM_NOT_HERE: "这里找不到那样东西。"
    INVENTORY_FULL: "你已经拿不下更多东西了。"
    INSUFFICIENT_FUNDS: "你的灵石不够。"
    NOT_FOR_SALE: "对方并不打算出手这样东西。"
    NO_MERCHANT_HERE: "此处没有可以交易的人。"
    TARGET_NOT_FOUND: "你要找的人并不在这里，也许根本不存在。"
    TARGET_NOT_PRESENT: "对方不在此处。"
    TARGET_DEAD: "对方已经死了。"
    ACTOR_DEAD: "你已经死了。"
    LOCATION_NOT_FOUND: "你不知道那个地方在哪。"
    LOCATION_UNREACHABLE: "从这里去不了那个地方。"
    LOCATION_LOCKED: "那里现在进不去。"
    CULTIVATION_NOT_READY: "修为尚未圆满，此时冲关只会白白折损道基。"
    ALREADY_AT_MAX_REALM: "此界之内，你已无路可进。"
    TIME_LIMIT_EXCEEDED: "你无法一次闭关这么久。"
    QUEST_NOT_FOUND: "没有这样一桩差事。"
    QUEST_NOT_OFFERED: "这桩差事眼下轮不到你。"
    FACTION_FORBIDS: "你的身份不允许你这么做。"
    AMBIGUOUS_INTENT: "你迟疑了一下——你到底想做什么？"
    NOT_PHYSICALLY_POSSIBLE: "这件事在此刻并不可能发生。"
    UNKNOWN_ACTION: "你想了想，最终什么也没做。"
  default: "你尝试了，但事情没有按你想的发生。"

action:
  MOVE: "你离开{from_location}，往{to_location}去。{travel_note}"
  MOVE_SAME: "你在{to_location}里转了一圈，又回到原处。"
  OBSERVE: "你放慢呼吸，把{location}看了一遍。{observation}"
  SEARCH: "你在{location}翻找了一阵。{search_result}"
  SEARCH_EMPTY: "你在{location}翻找了一阵，什么也没找到。"
  TALK: "你朝{target}走过去，开口说话。"
  ASK: "你向{target}问起{topic}。"
  CONVERSATION: "你与{target}攀谈起来。"
  CULTIVATE: "你盘膝坐下，运转功法。{duration_label}后收功，{progress_note}"
  BREAKTHROUGH_SUCCESS: "灵力冲开关隘。{realm_before}至此终结，你踏入{realm_after}。"
  BREAKTHROUGH_FAILED: "灵力在关隘前撞得粉碎，反噬顺着经脉倒卷回来。{injury_note}"
  ATTACK_HIT: "你出手了。{damage_note}"
  ATTACK_MISS: "你出手了，却被{target}让开。"
  ATTACK_BLOCKED: "你的攻势撞在{target}的护体灵光上，连声响都没留下。"
  DEFEND: "你收势守住门户。"
  USE_ITEM: "你取出{item}用了。{effect_note}"
  GIVE_ITEM: "你把{item}递给{target}。"
  PICKUP: "你把{item}收了起来。"
  DROP: "你把{item}丢在地上。"
  BUY: "你花了{cost}灵石，买下{item}。"
  SELL: "你把{item}出手，换来{cost}灵石。"
  STEAL_SUCCESS: "你手上一轻，{item}已经到了你怀里。没有人看向这边。"
  STEAL_FAILED: "你的手刚伸出去，就被人看了个正着。"
  HIDE_SUCCESS: "你屏住气息，退进阴影里。"
  HIDE_FAILED: "你藏得不够好。"
  FOLLOW: "你远远缀在{target}身后。"
  REST: "你歇了{duration_label}。{recovery_note}"
  WAIT: "你等了{duration_label}。"
  ACCEPT_QUEST: "你应下了这桩差事。"
  REJECT_QUEST: "你摇头拒绝。"
  USE_SKILL: "你催动{skill}。{effect_note}"
  CUSTOM: "你照自己的办法采取了行动，这一步已经有了结果。"
  # Nothing was attempted - the scene simply holds. Never an accusation.
  idle: "你停在原地，念头转了几转，终究没有落到实处。周围的一切照旧。"
  DEFAULT: "这次行动已经改变了眼前的局面。"

notes:
  travel: "路上花了{minutes_label}。"
  damage: "{target}受了{damage}点伤。"
  damage_lethal: "{target}倒了下去，再没有起来。"
  cultivation_progress: "修为推进了{progress}。"
  cultivation_no_progress: "这一坐几乎没有寸进。"
  injury: "你伤得不轻。"
  recovery: "气力回来了一些。"
  effect_none: ""

npc:
  speaks: "{name}说：「{line}」"
  refuses: "{name}没有答应。"
  silent: "{name}没有说话。"
  leaves: "{name}转身走了。"
  approaches: "{name}朝你这边过来。"
  attacks: "{name}向你出手。"
  observes: "{name}打量着你。"
  # 兜底句绝不能把内部标签拼进正文（旧版会写出"韩墨neutral。"）。
  default: "{name}没有多说什么。"

world_event:
  prefix: "与此同时，"
  default: "{description}"
  natural_death: "{name}寿数已尽，离开了人世。"

duration:
  minute: "{n}刻"
  hour: "{n}个时辰"
  day: "{n}日"
  month: "{n}个月"
  year: "{n}年"

query:
  status_header: "【自身状态】"
  inventory_header: "【随身之物】"
  inventory_empty: "你身无长物。"
  relationships_header: "【你认识的人】"
  relationships_empty: "你还没有真正认识什么人。"
  quests_header: "【在身的差事】"
  quests_empty: "你眼下没有接下任何差事。"
