# 初始任务（可由 NPC 提供；玩家拒绝后仍可能由别人完成 §41/§42）
quests:
  - key: quest_herb_delivery
    name: 护送灵药
    giver: outer_steward_wang
    status: offered
    goal: {type: escort, item: blood_coagulation_grass, quantity: 20, from: qingyun_spirit_field, to: herb_shop}
    constraints: {deadline_minutes: 4320, min_realm: qi_refining}
    rewards: {spirit_stone: 150, faction_reputation: {qingyun_sect: 3}}
    failure_conditions: [cargo_lost, deadline_passed]
    world_consequences:
      on_success: {faction_resource: {qingyun_sect: {spirit_herbs: 0.01}}}
      on_failure: {faction_resource: {qingyun_sect: {spirit_herbs: -0.02}}, tension: 3}
      if_player_refuses: {reassign_to: [disciple_chen, rogue_cultivator_du], success_chance: 0.6}
    plot_thread: null

  - key: quest_night_watch
    name: 灵药园夜巡
    giver: elder_yao
    status: offered
    goal: {type: guard, location: qingyun_spirit_field, duration_minutes: 720}
    constraints: {deadline_minutes: 10080, min_realm: qi_refining}
    rewards: {spirit_stone: 200, item: {qi_recovery_pill: 2}, faction_reputation: {qingyun_sect: 5}}
    failure_conditions: [theft_occurred_during_watch, abandoned_post]
    world_consequences:
      on_success: {reveal_fact_chance: {fact_bai_su_saw_figure: 0.5}}
      on_failure: {tension: 5, advance_thread: thread_infiltration}
      if_player_refuses: {reassign_to: [guard_ma, bai_su], success_chance: 0.35}
    plot_thread: thread_infiltration

  - key: quest_find_medicine
    name: 韩墨的求助
    giver: han_mo
    status: offered
    goal: {type: acquire, item: solid_origin_pill, quantity: 1, deliver_to: han_mo}
    constraints: {deadline_minutes: 43200}
    rewards: {relationship: {han_mo: {trust: 12, affection: 15}}, spirit_stone: 0}
    failure_conditions: [deadline_passed, han_ling_died]
    world_consequences:
      on_success: {advance_thread: thread_han_mo_desperation}
      on_failure: {character_state: {han_ling: {health: -30}}, advance_thread: thread_han_mo_desperation}
      if_player_refuses: {reassign_to: [rogue_cultivator_du], success_chance: 0.25}
    plot_thread: thread_han_mo_desperation
