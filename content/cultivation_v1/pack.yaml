  plan_connectors: [然后, 接着, 随后, 再, 同时]
  # 玩家把接下来一小段交给 AI 自行推进的说法（必须整句完全匹配）。
  continue_words: [继续, 继续。, 往下走, 接着说, 接着往下, 让故事继续, "..."]
  # 玩家常用的俗称 → 世界中真实存在的 key。世界管家会先查这张表，再考虑造物。
  entity_aliases:
