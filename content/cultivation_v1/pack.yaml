    power: 灵力
    age_suffix: 岁
    realm: 境界
    root: 灵根
    faction: 阵营
    male: 男
    female: 女
    unspecified: 未指定
    story_lead: 本局共同主角
    no_story_lead: 本局未指定感情搭档
    absent: 当前不在场
  relationship_labels:
    affection: 好感
    trust: 信任
    respect: 尊重
    fear: 畏惧
    hatred: 仇恨
    suspicion: 怀疑
