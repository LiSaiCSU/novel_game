    QUERY_INVENTORY: [背包, 储物袋, 我的东西, 身上有什么, 查看物品, 物品栏]
    QUERY_RELATIONSHIPS: [人物关系, 我认识谁, 关系表, 认识的人, 人际]
    QUERY_QUESTS: [我的任务, 任务列表, 在身的差事, 接了什么任务]
  request_size_hints:
