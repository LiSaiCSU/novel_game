key: cultivation_v1
name: 七日血契
genre: cultivation
version: "2.8.0"
engine_min_version: "0.2.0"
primary_progression_key: cultivation
language: zh-CN
assets:
  - key: seven_day_blood_pact_cover
    kind: cover
    path: official/cultivation_v1/seven-day-blood-pact-cover-v1.png
    alt: 血色秘境将启的深夜，一名外门弟子在青云宗住处查看染血名册残页
rule_plugin:
  path: rule_plugin.py
  class: CultivationRulePlugin
  api_version: "1"

world:
  name: 青云界·七日血契
  description: |
    青云界是修真界东域一隅。青云宗坐镇青云山脉数百年，与山下的青云城互为表里；
    往北是妖兽横行的黑风山，往南是灵植繁茂的落霞谷，往东是每三十年开启一次的赤霞秘境。
    如今秘境异动，七日后就会提前开启。有人把本该争抢的入境名额改成了一份血祭名单，
    又把名单残页塞进一名外门弟子的住处。血魔宗、宗门内奸和想活下去的人都在抢同一条线索；
    玩家若不在七日内洗清嫌疑并毁掉阵眼，就会成为秘境开门时的第一份祭品。
  start_location: qingyun_outer_disciple_quarters
  world_seed_default: "qingyun-0001"

story:
  title: 七日血契
  opening_location: qingyun_outer_disciple_quarters
  premise: |
    你在青云宗外门熬了几年：会做杂役、会算贡献、知道什么时候该低头，也知道自己的修为经不起一次误判。
    赤霞秘境本该下月开启，却突然提前到七日后。这个消息先让外门的物价翻了一倍，随后才轮到人命。
    今晨，你的床边多出一张血写的祭品名册残页，第一行就是你的名字；执法堂已经在来查房的路上。
    另一半线索掌握在本局选定的成年搭档手中。你们各有不能交出去的东西，合作不是信任，而是暂时都没有更好的活路。
  opening_blueprint:
    player_context: 先让读者看到主角在外门如何生活、靠什么本事站稳脚，以及玩家填写的来历为何影响她处理麻烦的方式；血名册不是主角人生的第一件事。
    acts:
      - purpose: 认识主角
        must_show: [用一次具体的晨间杂务交代修为、身份与手头拮据, 让主角用自己的本事解决一个很小但真实的问题]
        comic_beat: 外门按贡献点收费的荒唐规矩彼此打架，主角熟练地从两张互相矛盾的告示里找到少交一笔钱的办法
      - purpose: 认识青云宗的日常规则
        must_show: [通过同门与执事的办事方式说明外门怎样奖惩, 让成年搭档先以具体行动表现性格而不是自报身世]
        comic_beat: 管事一边强调宗门清修，一边为一只被记成公物的水壶追查了半个院子
      - purpose: 日常被打断
        must_show: [血名册残页出现, 主角确认自己的名字和可用筹码, 执法堂逼近但不提前揭晓幕后人]
        comic_beat: 不在血名册与执法堂到场这种危险上抖包袱，让此前的日常趣味在此戛然而止
    humor_rule: 笑点来自外门资源紧张、规章繁琐和熟人互相拆台；不把受害者、伤势、胁迫或修为羞辱写成笑话。
    choice_gate: 主角是什么处境、能调用什么本事、血名册为什么危险、搭档刚刚做过什么，以及第一个选择会保住或冒险失去什么。
  lead_by_player_gender:
    male: lin_qingxue
    female: zhao_wuji
  lead_goals:
    lin_qingxue:
      long_term: 七日内查清血名册与师姐遇害的关联，毁掉血祭阵并保护共同查案的人
      short_term:
        - 判断玩家是否值得交换失窃药材清单
        - 在执法堂收走残页前确认背面阵纹
        - 找到血祭阵眼所在位置
    zhao_wuji:
      long_term: 七日内摆脱体内阵印，查出利用自己的人并与共同查案的人毁掉血祭阵
      short_term:
        - 确认来路不明的丹药是否会回应血名册
        - 判断玩家是诱饵还是能合作的人
        - 在阵印被激活前找到解除办法
  starter_items:
    - {key: blood_roster_fragment, quantity: 1}
  endings:
    - key: ending_array_eye_broken
      type: other
      title: 阵眼碎在开门之前
      priority: 95
      epilogue: >
        赤霞秘境按原本的日子开了，没有提前，也没有人在门口被点名。
        阵眼碎的时候只响了一声，像谁在很远的地方把一只碗放回桌上。
        执法堂后来把血名册的原本收了上去，抄了七个名字，第一个不是你的。
        外门的物价花了半个月才落回去。你照旧挑水、算贡献点、在两张互相打架的告示里省下三个点，
        只是从那以后，夜里有人敲门，你会先看一眼床底那块松动的青砖。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_break_array_eye.status]}, completed]}
          - {op: eq, args: [{op: get, args: [quests.quest_clear_the_room.status]}, completed]}
    - key: ending_name_taken_back
      type: other
      title: 把名字要回来
      priority: 86
      epilogue: >
        血名册的原本终究是落到了你手里。你没有烧它——烧了，你的清白也一起没了。
        你把它摊在执事堂的长桌上，让所有认得字的人看清第一行是谁添上去的。
        阵眼没能毁掉，赤霞秘境还是提前开了门，但开门那天你站在山下的青云城里，
        听着钟声响过七下，一直到第八下也没有响。你活过了那七天，代价是这座山从此不再是你的家。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_recover_roster.status]}, completed]}
          - {op: eq, args: [{op: get, args: [quests.quest_clear_the_room.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_break_array_eye.status]}, completed]}
    - key: ending_two_names_one_road
      type: romance
      lead: lin_qingxue
      requires_consent: true
      title: 两个名字，一条路
      priority: 84
      epilogue: >
        阵眼碎了以后，林清雪把那半张残页折好还给你，说这东西该由写错名字的人自己收着。
        她没有回内门。真传弟子的白边道袍换成了灰的，站在演武场角上和你一起削那几块被剑气啃豁的青石。
        她照旧话少，照旧叩剑鞘，只是叩的节奏你现在听得懂了——三下是"人在"，两下是"别过来"。
        你们没有说过什么承诺的话。七天里说过的话已经够用一辈子记着了。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_break_array_eye.status]}, completed]}
          - {op: eq, args: [{op: get, args: [consent.lin_qingxue]}, accepted]}
          - {op: gte, args: [{op: get, args: [relationships.lin_qingxue.trust]}, 35]}
          - {op: gte, args: [{op: get, args: [relationships.lin_qingxue.affection]}, 30]}
    - key: ending_blade_between_us
      type: romance
      lead: zhao_wuji
      requires_consent: true
      title: 阵印落下的地方
      priority: 84
      epilogue: >
        赵无极体内的阵印是在阵眼碎的同一刻散掉的。他疼得跪在地上，嘴上还没停：
        "看见没有，这就是差距。"你没接话，把他半边身子扛起来往山下走。
        后来他真的少说了很多废话，只是每回你要出远门，他都会先把那把没开刃的练习剑往你手里塞一次，
        再嫌弃地拿回去。他说这叫习惯。你知道那不叫习惯。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_break_array_eye.status]}, completed]}
          - {op: eq, args: [{op: get, args: [consent.zhao_wuji]}, accepted]}
          - {op: gte, args: [{op: get, args: [relationships.zhao_wuji.trust]}, 35]}
          - {op: gte, args: [{op: get, args: [relationships.zhao_wuji.affection]}, 30]}
    - key: ending_two_who_walked_out
      type: bond
      title: 一起走出来的两个人
      priority: 72
      epilogue: >
        血祭阵散了，你们谁也没提那七天里互相瞒过的事。有些账不清算，日子才过得下去。
        搭档回了原本该去的地方，你留在外门，照旧挑水，照旧在告示上抠字眼。
        每个月总有一封信从山那边过来，不写落款，只写一句"还活着"。你回的也是那三个字。
        这不是圆满，但在七日血契之后，能有个人值得你花笔墨写三个字，已经很够。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_break_array_eye.status]}, completed]}
          - {op: gte, args: [{op: get, args: [relationships.lin_qingxue.trust]}, 25]}
    - key: ending_down_the_mountain
      type: independent
      title: 自己走下山
      priority: 45
      epilogue: >
        你没有洗清嫌疑，也没能碰到阵眼。第七天的凌晨，你把青云宗的牙牌压在枕头底下，
        从后山那条没人巡的小道下去了。石溪村的刘老栓看见你，没问，只把烟杆子往腰上一别，
        指了指往北岔出去的那条路。你走的时候天还没亮，山门的钟在身后响了七下。
        名字还在那张纸上，但人不在名单能找到的地方了。这也算一种活法。
      condition:
        op: and
        args:
          - {op: ne, args: [{op: get, args: [quests.quest_break_array_eye.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_clear_the_room.status]}, completed]}
          - {op: gte, args: [{op: get, args: [world.minute]}, 213167280]}
    - key: ending_first_offering
      type: other
      title: 开门时的第一份祭品
      priority: 20
      hidden_until_available: true
      epilogue: >
        赤霞秘境提前开了七天。开门要人血引路，名册上的第一行写着谁，谁就先走这一步。
        没有人来解释，也没有人来道歉——外门的规矩向来如此，出了事先找一个交代得过去的人。
        你最后看见的是石阶上那两只木桶，一桶东泉，一桶西泉，兑好的水还没来得及浇下去。
        月见草到底活没活，你不知道了。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_clear_the_room.status]}, failed]}
          - {op: ne, args: [{op: get, args: [quests.quest_break_array_eye.status]}, completed]}
  relationship_boundaries: |
    感情线只发生在成年、具备自主意愿的玩家与成年搭档之间。允许危险后的靠近、试探、暧昧对话、
    克制的亲吻或淡出处理，但不得露骨描写性行为或身体部位，不得把胁迫、控制或权力压迫包装成浪漫。
    玩家可以拒绝感情发展；关系变化必须由共同选择、实际行动和已提交事件支撑，并同时推进主线。

narrative_style:
  language: 中文
  person: 第二人称
  tense: 现在时
  # 白话、好读、事情说清楚。不是散文比赛，读者要的是故事往前走。
  tone: 有烟火气的悬疑冒险式东方玄幻；白话、利落、人物会犯小错也会互相拆台，危险来临时真正紧张，感情张力克制且必须服务共同危机
  target_length: 1800
  avoid_phrases:
    - 嘴角勾起一抹弧度
    - 嘴角勾起一抹弧线
    - 眼中闪过一丝异色
    - 眼中闪过一抹精光
    - 心中暗道
    - 心中暗自
    - 恐怖如斯
    - 不由得倒吸一口凉气
    - 空气仿佛凝固
    # 下面这些是本引擎实测中反复出现的 AI 腔，一律禁用。
    - 心里微沉
    - 一时却又抓不住头绪
    - 总觉得哪里有些不对
    - 指尖悬在
    - 目光扫过
    - 又落回
    - 风卷着
    - 喉结动了动
    - 话咽了回去
    - 眼神暗了暗
    - 脸色微微一变
    - 深藏功与名
    - 淡淡地说道
  phrase_repeat_window: 12
  phrase_repeat_threshold: 2
  guidance:
    - 每个场景至少推进目标、线索、冲突、关系或不可逆后果中的一项
    - 优先写具体动作和有信息量的短对话，环境只写影响行动的部分
    - 主角可以失败，但失败必须改变局势并产生可追踪的后果
    - 感情张力必须服务共同危机与人物选择，禁止突然爱上、无因吃醋和无关主线的暧昧注水
    - 不机械追求反转；转折必须来自既有动机、线索或已经发生的事件
    - 紧张场面之间安排短促的人情味或办事笑料，笑点来自资源、规矩和人物性格，不能靠现代网络梗或把角色写蠢
    - 一场对话必须改变信息、条件或关系，禁止连续用停顿、眼神和欲言又止假装有戏

model_preferences:
  narrative_temperature: 0.85
  npc_temperature: 0.7
  director_temperature: 0.6

