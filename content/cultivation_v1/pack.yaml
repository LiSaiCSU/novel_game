key: cultivation_v1
name: 青云界
genre: cultivation
version: "1.0.0"
engine_min_version: "0.1.0"
language: zh-CN

world:
  name: 青云界
  description: |
    青云界是修真界东域一隅。青云宗坐镇青云山脉数百年，与山下的青云城互为表里；
    往北是妖兽横行的黑风山，往南是灵植繁茂的落霞谷，往东是每三十年开启一次的赤霞秘境。
    近年来血魔宗势力自西南渗透，大周皇朝在凡俗界收拢兵权，散修联盟在青云城暗中壮大。
    这个世界不为任何人停留。
  start_location: qingyun_outer_disciple_quarters
  world_seed_default: "qingyun-0001"

narrative_style:
  language: 中文
  person: 第二人称
  tense: 现在时
  tone: 克制、写实、有质感的东方玄幻，不追求爽感
  target_length: 320
  avoid_phrases:
    - 嘴角勾起一抹弧度
    - 嘴角勾起一抹弧线
    - 眼中闪过一丝异色
    - 眼中闪过一抹精光
    - 心中暗道
    - 心中暗自
    - 恐怖如斯
    - 不由得倒吸一口凉气
    - 空气仿佛凝固
    - 脸色微微一变
    - 深藏功与名
    - 淡淡地说道
  phrase_repeat_window: 12
  phrase_repeat_threshold: 2
  guidance:
    - 优先写具体动作、环境细节、有信息量的对话
    - 减少无意义的修辞堆砌与排比
    - 世界对主角的存在保持冷漠
    - 允许平淡，允许无事发生

model_preferences:
  narrative_temperature: 0.85
  npc_temperature: 0.7
  director_temperature: 0.6

vocabulary:
  # 引擎不认识这些词，只有内容包认识；用于 fallback 意图解析与叙事本地化
