    MOVE: [去, 前往, 走向, 回到, 进入, 出发, 赶往, 下山, 上山]
    TALK: [聊, 交谈, 说话, 攀谈, 打招呼, 寒暄, 找, 问候]
    ASK: [问, 询问, 打听, 请教, 套话, 打探]
    OBSERVE: [看, 观察, 打量, 环顾, 查看, 端详, 留意]
    SEARCH: [搜, 搜索, 搜查, 翻找, 寻找, 探查, 摸索]
    FOLLOW: [跟, 跟踪, 尾随, 跟着, 追踪]
    HIDE: [躲, 藏, 隐藏, 潜伏, 屏息, 隐匿]
