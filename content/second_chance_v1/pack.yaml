      - {path: knowledge.player.fact_alley_incident_in_nine_days, op: eq, expected: KNOWN}
      - {path: knowledge.su_wanqing.fact_alley_incident_in_nine_days, op: eq, expected: UNKNOWN}
      - {path: knowledge.player.fact_order_is_a_trap, op: eq, expected: KNOWN}
      - {path: knowledge.su_jianguo.fact_order_is_a_trap, op: eq, expected: UNKNOWN}
  - key: sister_hides_it
    name: 妹妹自己知道被人堵过但没告诉家里
    scenario: main_story
    assertions:
      - {path: knowledge.su_wanqing.fact_sister_already_followed, op: eq, expected: KNOWN}
      - {path: knowledge.chen_shufen.fact_sister_already_followed, op: eq, expected: UNKNOWN}
      - {path: knowledge.su_jianguo.fact_sister_already_followed, op: eq, expected: UNKNOWN}
  - key: best_ending_needs_both
    name: 最好的结局需要同时保住妹妹和厂子
    scenario: main_story
    fixtures:
      quests: {quest_protect_sister: completed, quest_stop_the_signing: completed}
    assertions:
      - {path: endings.ending_both_saved.available, op: eq, expected: true}
world:
  name: 滨海·二〇一三年七月
  description: 二〇一三年七月的滨海。父亲的五金加工厂还开着，妹妹还在念高二，韩记的那张订单刚送到厂里。十年后这些都没了，而你带着那十年的记忆回到了这个早上。
  start_location: su_room
  world_seed_default: binhai-july-third
story:
  title: 重生：这一次换我来
  opening_location: su_room
  premise: |
    你死过一次。或者说，你活到了三十岁，然后在一个再普通不过的早上，睁眼看见了十八岁的天花板。
    墙上的日历写着二〇一三年七月三日。下铺的妹妹还在睡，她今年高二，还能走路，还能笑。
    厨房里母亲在熬绿豆汤。父亲已经去了厂里——韩记那张订单昨天送到，他今天就要签。
    你记得那张单子怎么把厂子拖垮，记得九天后妹妹在三中后门那条巷子里出的事，
    记得后来十年家里是怎么一点一点散掉的。
    你什么都记得，但没有一个人会信你。你只有九天。
  opening_blueprint:
    player_context: 开场第一句就是重生本身带来的冲击，不做铺垫。玩家上一世做什么、最过不去哪件事，决定他睁眼之后第一个动作是扑向谁。
    acts:
      - purpose: 第一段就回来
        must_show: [第一句之内主角意识到自己回到了十年前的这个早上, 用一个具体的东西确认年份——日历、旧手机、还没坏的冰箱, 妹妹活着且完好地出现在同一个房间里]
        comic_beat: 最激动的时刻他先被十八岁的身体绊了一跤，或者被一句极其日常的催促打断
      - purpose: 看清他有多没有本钱，也看清他知道什么
        must_show: [点明九天后妹妹会出事和父亲今天要签那张单, 让家里至少一个人当面把他当小孩打发, 让读者明白他手上唯一多出来的东西只是记忆]
        comic_beat: 他想开口警告，先被母亲用一句多喝汤堵回去
      - purpose: 他抢回半步，代价立刻上门
        must_show: [主角用一件只有他知道的事扳回半寸——说准一个数字、拦下一个动作、点破一份单据, 这半寸立刻让人开始怀疑他为什么会知道, 停在一个当场就要回答的问题上]
        comic_beat: 他刚说准一件事，家里人第一反应不是信他，是问他是不是发烧了
    humor_rule: 笑点来自重生者和十八岁身份之间的落差、家里人的日常唠叨和年代细节；不拿妹妹遇到的事、伤病或家庭困境开玩笑。
    choice_gate: 主角回到了哪一天、九天后会发生什么、父亲今天要签什么、他手上唯一的东西是记忆，以及第一个选择会先救哪一头。
  starter_items: [{key: old_notebook, quantity: 1}, {key: bus_card, quantity: 1}, {key: rmb, quantity: 86}]
  player_template:
    constraints: {minimum_age: 18, maximum_age: 22}
    properties: {life_status: came_back}
  relationship_boundaries: |
    本作品的核心关系是家人与同伴，不以恋爱为主线。
    任何可发展的关系都只发生在成年人之间，必须建立在共同经历与明确表达之上，玩家可以随时拒绝并保持拒绝。
    不写露骨性描写，不把胁迫、控制或恩情美化成感情；未成年角色不涉及任何恋爱或性相关内容。
  endings:
    - key: ending_both_saved
      type: other
      title: 这一次都在
      priority: 95
      epilogue: >
        第九天晚上九点半，晚自习散场。你站在三中后门的路灯下，妹妹背着书包出来，
        看见你愣了一下，说了句"你怎么来了"，然后自己走过来挽住你的胳膊。
        巷子口没有人。厂里那张订单最后没签，冲床赎回来了，父亲那天在茶摊坐到很晚，
        跟人说他儿子今年像是突然长大了。
        十年后你还记得这个夏天，但那已经是另一个十年。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_protect_sister.status]}, completed]}
          - {op: eq, args: [{op: get, args: [quests.quest_stop_the_signing.status]}, completed]}
    - key: ending_sister_only
      type: bond
      lead: su_wanqing
      title: 厂子没了，人还在
      priority: 80
      epilogue: >
        订单还是签了，厂子撑到年底就撑不住了。工人一个个走，最后一台机器被拉走那天下着雨。
        但妹妹好好的。她照常上学，照常考试，第二年考出了滨海。
        走的那天她在车站问你："哥，你那个夏天到底是怎么了？"
        你说没什么。她看了你很久，说："反正你那次是对的。"
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_protect_sister.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_stop_the_signing.status]}, completed]}
    - key: ending_factory_only
      type: other
      title: 厂子保住了
      priority: 70
      epilogue: >
        那张单子没签。韩记的四百公斤废铁被翻了出来，河沿这条街半年没人再提吃厂子的事。
        父亲的厂做到了二十个人，他很高兴，逢人就说。
        只有你知道第九天那个晚上，你在另一个地方。
        妹妹后来没能回学校。你把这件事记了一辈子，第二辈子。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_stop_the_signing.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_protect_sister.status]}, completed]}
    - key: ending_exposed
      type: independent
      title: 你到底是谁
      priority: 45
      epilogue: >
        你说准的事太多了。母亲在厨房里问你的时候手一直在抖，
        妹妹站在门口没有进来，父亲把烟按灭在鞋底上，一句话没说。
        那天之后家里人还是待你很好，好得像在待一个客人。
        你救下了该救的，也把自己从这个家里挪了出去——这是这一次的代价。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_keep_your_secret.status]}, failed]}
          - {op: gte, args: [{op: get, args: [world.minute]}, 12960]}
    - key: ending_same_again
      type: other
      title: 又是这样
      priority: 20
      hidden_until_available: true
      epilogue: >
        第九天晚上九点半，晚自习照常散场。
        你在市场那头，正跟人争一张单子的价钱，争得很凶，几乎就要赢了。
        手机响的时候你没接，因为那是个陌生号码。
        你什么都记得，也什么都没改。
      condition:
        op: and
        args:
          - {op: ne, args: [{op: get, args: [quests.quest_protect_sister.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_stop_the_signing.status]}, completed]}
          - {op: gte, args: [{op: get, args: [world.minute]}, 12960]}
narrative_style:
  language: 中文
  person: 第二人称
  tense: 现在时
  tone: 快节奏年代重生爽剧；先知带来的优势和说不出口的代价并行。白话、利落、生活细节扎实，情绪先行但因果不断
  target_length: 1500
  avoid_phrases:
    - 嘴角勾起一抹弧度
    - 眼中闪过一丝异色
    - 空气仿佛凝固
    - 心中暗道
    - 淡淡地说道
    - 你不知道的是
    - 全场哗然
    - 前世的记忆涌上心头
    - 上一世的画面在眼前闪过
    - 蝴蝶效应
  phrase_repeat_window: 12
  phrase_repeat_threshold: 2
  pacing: short_drama
  pacing_rules:
    - 每一章必须有一个爆点：说准一件事、拦下一个动作、被人当面质问、代价当场落地、
      或某个前世的节点提前到来。指不出爆点是哪一句就重写
    - 爽点来自强弱转换：先让人把主角当小孩打发，再让他用只有他知道的事把局面扳回来。
      落差越大越爽；被压的那一段不能超过三分之一篇幅，翻盘必须在本章之内发生
    - 每用一次先知，怀疑就涨一格。爽感和代价必须同时出现，不能只爽不付账
    - 反转每三到五章翻一次，翻的是人的立场或事情的真相，不是主角的能力。
      反转必须能在已埋的线索、已知事实或人物动机里找到根据
    - 结尾必须卡在钩子上：话被打断、门被推开、电话响了、日子又少一天。不要用情绪或景物收尾
    - 台词是子弹不是棉花：一句话同时干两件事，推进局势并暴露立场或关系
    - 赶路、等待、日常一句带过；对峙、追问、摊牌拆开写细
    - 年代细节要具体到能摸到：价钱、车次、机器型号、电视里在放什么。但一段最多一处
  guidance:
    - 主角不能直接说自己重生了，也不能把未来当证据摆出来；他只能用"我猜""我看见过""上次有人这么干过"
    - 家里人第一反应永远是不信。信任要一件一件挣，不是说准一次就够
    - 韩磊每一步都合乎生意逻辑，被翻盘是因为他算漏了一个十八岁的孩子会看合同
    - 妹妹是活人不是任务目标：她有自己的判断、自尊和不肯说的事
    - 每两三个高压场面之间放一次短促的年代生活味，用来加速而不是松劲
    - 不要写全知式的旁白提醒读者"这就是转折点"
