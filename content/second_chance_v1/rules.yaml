action_plan: {max_total_minutes: 1440}
time_costs:
  TALK: {min: 3, max: 20}
  ASK: {min: 3, max: 20}
  CONVERSATION: {min: 5, max: 30}
  OBSERVE: {min: 3, max: 12}
  SEARCH: {min: 10, max: 60}
  FOLLOW: {min: 8, max: 40}
  HIDE: {min: 3, max: 25}
  MOVE_LOCAL: {min: 2, max: 25}
  MOVE_REGIONAL: {min: 20, max: 120}
  USE_ITEM: {min: 1, max: 15}
  GIVE_ITEM: {min: 1, max: 8}
  PICKUP: {min: 1, max: 5}
  DROP: {min: 1, max: 5}
  REST: {min: 30, max: 480}
  WAIT: {min: 5, max: 120}
  ACCEPT_QUEST: {min: 2, max: 10}
  REJECT_QUEST: {min: 1, max: 5}
  CUSTOM: {min: 5, max: 45}
  SECLUSION_MAX_MINUTES: 12960
relationship:
  dimensions: [affection, trust, respect, fear, hatred, suspicion, dependency, familiarity]
  ranges:
    affection: {min: -100, max: 100, default: 0}
    trust: {min: -100, max: 100, default: 0}
    respect: {min: -100, max: 100, default: 0}
    fear: {min: 0, max: 100, default: 0}
    hatred: {min: 0, max: 100, default: 0}
    suspicion: {min: 0, max: 100, default: 0}
    dependency: {min: 0, max: 100, default: 0}
    familiarity: {min: 0, max: 100, default: 0}
    boundaries: {min: 0, max: 100, default: 50}
  # 爽剧的关系是会当场翻盘的：一次打脸就该看得见落差。
  max_delta_per_event: {trivial: 2, minor: 8, major: 25, life_changing: 45}
  familiarity_gain_per_interaction: 1
  decay_per_month_without_contact: {familiarity: 1, affection: 1, suspicion: 1}
social:
  base_success: 0.28
  weights: {trust: 0.004, affection: 0.002, respect: 0.003, familiarity: 0.001, hatred: -0.005, suspicion: -0.004, charisma: 0.01, reputation: 0.002}
  request_size_penalty: {trivial: 0, small: 0.1, moderate: 0.25, large: 0.5, extreme: 0.9}
  risk_penalty_weight: 0.5
  value_conflict_penalty: 0.45
  taboo_hard_refuse: true
  first_meeting_penalty: 0.15
  min: 0.01
  max: 0.95
economy: {currency_key: rmb, currency_name: 现金, buy_markup: 1, sell_discount: 0.5, haggle_max_shift: 0.12, reputation_price_weight: 0.002}
inventory: {max_slots: 20, max_weight: 0}
information:
  spread_chance_per_day: {PUBLIC: 0.6, LOCAL: 0.3, FACTION: 0.2, PRIVATE: 0, SECRET: 0}
  confidence_decay_per_hop: 0.2
memory:
  top_k: 10
  min_importance: 0.12
  conversation_importance:
    base: 0.12
    first_meeting: 0.4
    major_npc: 0.4
    request_size:
      moderate: 0.35
      large: 0.5
      extreme: 0.65
  recency_half_life_minutes: 4320
  decay_floor: 0.1
  retrieval_weights: {similarity: 0.3, importance: 0.3, recency: 0.16, relationship: 0.14, context: 0.1}
  always_remember_event_types: [PROMISE, SECRET_DISCLOSURE, BETRAYAL, CONFRONTATION, RESCUE]
narrative:
  tension_start: 30
  tension_decay_per_day: 3
  tension_gain_by_importance: 26
  tension_gain_floor: 0.1
  high_threshold: 82
  max_consecutive_high_turns: 4
  bands: [{key: quiet, name: 还来得及, min: 0, max: 30}, {key: moving, name: 已经开始动, min: 30, max: 58}, {key: tense, name: 拦不住了, min: 58, max: 82}, {key: climax, name: 就是今天, min: 82, max: 101}]
director:
  min_interval_turns: 1
  thread_patience_minutes: 1620
  pacing_rules:
    - 这是一部快节奏爽剧：默认应该出事，平淡才需要理由
    - 只要能在既有线程、近期事件或待兑现事项里找到依据，就安排事件；
      连续两回合没有事件时，优先推进最紧的那条线
    - 优先选会立刻改变玩家处境的事件：有人上门、有人翻脸、期限被提前、
      东西被拿走、身份被戳穿、第三方插手
    - 事件要冲着玩家来，落在玩家看得见的地方，不要只在远处推动局势
    - 仍然不得凭空新增人物、身份或危机：升级已有的矛盾，不要发明新的
  high_importance_override: 0.5
  max_events_per_day: 6
  max_schedule_delay_minutes: 10080
  allowed_event_types: [NPC_RETURN, NPC_DEPARTURE, NPC_APPROACH, RUMOR_SPREAD, FACTION_MOVE, QUEST_OFFER, DISCOVERY, ENVIRONMENT_SHIFT, CONFRONTATION, FORESHADOWING, SECRET_DISCLOSURE, PROMISE, RESOURCE_CHANGE]
simulation:
  tick_minutes: {lod1: 120, lod2: 720, lod3: 1440}
  max_materialized_events_per_jump: 96
  npc_goal_action_interval_minutes: 360
  faction_drift_per_week: {resources: {min: -0.03, max: 0.03}, military_power: {min: 0, max: 0}, reputation: {min: -2, max: 2}}
  offline_event_chance_per_week: {lod1: 0.4, lod2: 0.25, lod3: 0.12}
auto_advance:
  max_steps: 5
  max_minutes: 480
  npc_llm_per_step: 2
  interrupt_importance: 0.5
  interrupt_health_loss: 0.12
  engaging_actions: [TALK, ASK, CONVERSATION, GIVE_ITEM]
  hostile_actions: [ATTACK, STEAL]
  offer_events: [QUEST_OFFER, CONFRONTATION, SECRET_DISCLOSURE]
consistency: {strict: true, checks: [alive, location, inventory, knowledge, faction, time]}
reputation: {ranges: {global: {min: -100, max: 100}, faction: {min: -100, max: 100}}}
