    importance: 0.99
    stage: 0
    participants: [player, luo_qi, song_wei, qi_yue, he_mingyuan]
    unresolved_questions: [谁改接安全总线, 如何隔离舞台线路, 第二路风机为何同时断电]
    foreshadowing: [按钮背板温度异常, 原始竣工图没有舞台支路, 任务卡要求拉一只不该碰的闸]
    related_facts: [fact_elimination_button_shares_safety_bus, fact_warning_was_hidden_for_ratings]
    next_beat_hint: 何明远照任务卡拉闸后，通风层第二台风机会断电
