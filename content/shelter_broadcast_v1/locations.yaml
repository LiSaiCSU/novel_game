  - {key: surface_station, name: 地面应急站, type: outdoor, parent: dome_nine, danger: 4, spirit_density: 1, description: 强辐射风暴与电磁干扰持续，只有短窗口能升起信标。, travel: {show_level: 8, relay_tunnel: 5}}
