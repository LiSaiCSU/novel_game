  - {key: air_plant, name: 通风净化层, type: room, parent: maintenance_ring, danger: 3, spirit_density: 1, description: 三台风机只剩两台可用，滤芯压差正在升高。, travel: {maintenance_ring: 4, residential_ring: 3}}
  - {key: water_plant, name: 水处理层, type: room, parent: maintenance_ring, danger: 2, spirit_density: 1, description: 反渗透泵停机，储水还能支撑二十小时。, travel: {maintenance_ring: 5, clinic: 4}}
  - {key: lower_dorm, name: 淘汰者下层宿舍, type: room, parent: maintenance_ring, danger: 2, spirit_density: 1, description: 六名被淘汰选手没有离开设施，节目组把他们安置在没有直播的下层。, travel: {maintenance_ring: 5, clinic: 3}}
  - {key: residential_ring, name: 生活环, type: level, parent: dome_nine, danger: 1, spirit_density: 1, description: 四十八个床位、厨房和真实物资仓组成的小型生活区。, travel: {show_level: 5, air_plant: 3, clinic: 2, supply_store: 2}}
  - {key: clinic, name: 医疗舱, type: room, parent: residential_ring, danger: 1, spirit_density: 1, description: 药品齐全但冷藏电源只剩六小时。, travel: {residential_ring: 2, lower_dorm: 3, water_plant: 4}}
