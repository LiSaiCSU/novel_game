locations:
  - {key: dome_nine, name: 九号穹顶, type: complex, parent: null, danger: 2, spirit_density: 1, description: 七层地下民防枢纽，上两层被改成真人秀摄影棚。}
  - {key: show_level, name: 节目摄影层, type: level, parent: dome_nine, danger: 1, spirit_density: 1, description: 灯光漂亮，真正应急线路却被布景挡住。, travel: {maintenance_ring: 4, residential_ring: 5, surface_station: 8}}
  - {key: elimination_stage, name: 淘汰舞台, type: room, parent: show_level, danger: 2, spirit_density: 1, description: 红色淘汰按钮错误并入真实安全总线。, travel: {studio_control: 2, sponsor_gallery: 2, maintenance_ring: 4}}
  - {key: studio_control, name: 节目导播舱, type: room, parent: show_level, danger: 1, spirit_density: 1, description: 剪辑脚本、投票算法和风暴预警都曾到过这里。, travel: {elimination_stage: 2, sponsor_gallery: 2}}
  - {key: sponsor_gallery, name: 赞助展廊, type: room, parent: show_level, danger: 1, spirit_density: 1, description: 自动广告系统有独立电池，断网后仍按时播口号。, travel: {elimination_stage: 2, studio_control: 2}}
  - {key: maintenance_ring, name: 地下维修环, type: level, parent: dome_nine, danger: 2, spirit_density: 1, description: 老式机械表和手动旁路比节目组的新屏幕可靠。, travel: {elimination_stage: 4, central_control: 3, air_plant: 4, power_room: 4, water_plant: 5, lower_dorm: 5}}
