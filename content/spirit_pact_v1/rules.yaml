action_plan: {max_total_minutes: 720}
time_costs:
  TALK: {min: 5, max: 30}
  ASK: {min: 5, max: 30}
  CONVERSATION: {min: 5, max: 40}
  OBSERVE: {min: 5, max: 25}
  SEARCH: {min: 20, max: 240}
  FOLLOW: {min: 10, max: 90}
  HIDE: {min: 5, max: 60}
  MOVE_LOCAL: {min: 2, max: 30}
  MOVE_REGIONAL: {min: 30, max: 300}
  USE_ITEM: {min: 1, max: 20}
  USE_SKILL: {min: 1, max: 30}
  GIVE_ITEM: {min: 2, max: 10}
  STEAL: {min: 10, max: 60}
  ATTACK: {min: 2, max: 30}
  DEFEND: {min: 1, max: 20}
  BUY: {min: 5, max: 40}
  SELL: {min: 5, max: 40}
  CULTIVATE: {min: 120, max: 480}
  BREAKTHROUGH: {min: 60, max: 720}
  PICKUP: {min: 1, max: 5}
  DROP: {min: 1, max: 5}
  REST: {min: 60, max: 600}
  WAIT: {min: 5, max: 240}
  ACCEPT_QUEST: {min: 2, max: 10}
  REJECT_QUEST: {min: 1, max: 5}
  CUSTOM: {min: 5, max: 120}
  SECLUSION_MAX_MINUTES: 86400
relationship:
  dimensions: [affection, trust, respect, fear, hatred, suspicion, dependency, familiarity]
  ranges:
    affection: {min: -100, max: 100, default: 0}
    trust: {min: -100, max: 100, default: 0}
    respect: {min: -100, max: 100, default: 0}
    fear: {min: 0, max: 100, default: 0}
    hatred: {min: 0, max: 100, default: 0}
    suspicion: {min: 0, max: 100, default: 5}
    dependency: {min: 0, max: 100, default: 0}
    familiarity: {min: 0, max: 100, default: 0}
    boundaries: {min: 0, max: 100, default: 50}
  max_delta_per_event: {trivial: 2, minor: 6, major: 18, life_changing: 40}
  familiarity_gain_per_interaction: 1
  decay_per_month_without_contact: {familiarity: 1, affection: 1, suspicion: 1}
social:
  base_success: 0.3
  weights: {trust: 0.004, affection: 0.002, respect: 0.004, familiarity: 0.001, hatred: -0.005, suspicion: -0.004, charisma: 0.01, reputation: 0.002}
  request_size_penalty: {trivial: 0, small: 0.1, moderate: 0.25, large: 0.55, extreme: 0.9}
  risk_penalty_weight: 0.55
  value_conflict_penalty: 0.45
  taboo_hard_refuse: true
  first_meeting_penalty: 0.15
  min: 0.01
  max: 0.95
economy: {currency_key: gold_soul_coin, currency_name: 金叶, buy_markup: 1.1, sell_discount: 0.5, haggle_max_shift: 0.12, reputation_price_weight: 0.002}
inventory: {max_slots: 24, max_weight: 0}
information:
  spread_chance_per_day: {PUBLIC: 0.5, LOCAL: 0.25, FACTION: 0.2, PRIVATE: 0, SECRET: 0}
  confidence_decay_per_hop: 0.2
memory:
  top_k: 10
  min_importance: 0.12
  conversation_importance:
    base: 0.10
    first_meeting: 0.35
    major_npc: 0.35
    request_size:
      moderate: 0.30
      large: 0.45
      extreme: 0.60
  recency_half_life_minutes: 14400
  decay_floor: 0.1
  retrieval_weights: {similarity: 0.3, importance: 0.3, recency: 0.15, relationship: 0.13, context: 0.12}
  always_remember_event_types: [PROMISE, SECRET_DISCLOSURE, BETRAYAL, RESCUE, DEATH, BREAKTHROUGH_SUCCESS]
narrative:
  tension_start: 35
  tension_decay_per_day: 3
  tension_gain_by_importance: 14
  tension_gain_floor: 0.12                # 低于这个重要度的琐事不推高张力
  high_threshold: 75
  max_consecutive_high_turns: 3
  bands:
    - {key: daily, name: 课业, min: 0, max: 25}
    - {key: progress, name: 修炼, min: 25, max: 55}
    - {key: tense, name: 缔契, min: 55, max: 75}
    - {key: climax, name: 生死, min: 75, max: 101}
director:
  min_interval_turns: 2
  thread_patience_minutes: 10800    # 六十天故事：一条高压线索最多晾七天半
  pacing_rules:
    - 允许平静回合：观察、整理、休息和关系留白是节奏的一部分
    - 玩家正在执行明确行动、面对选择或消化结果时，返回 NO_EVENT
    - 不要为了追求固定频率机械安排反转
  high_importance_override: 0.85
  max_events_per_day: 3
  max_schedule_delay_minutes: 2880
  allowed_event_types: [NPC_RETURN, NPC_DEPARTURE, NPC_APPROACH, RUMOR_SPREAD, FACTION_MOVE, QUEST_OFFER, DISCOVERY, ENVIRONMENT_SHIFT, CONFRONTATION, FORESHADOWING, SECRET_DISCLOSURE, PROMISE, BETRAYAL, RESCUE, DEATH]
simulation:
  tick_minutes: {lod1: 240, lod2: 1440, lod3: 10080}
  max_materialized_events_per_jump: 96
  npc_goal_action_interval_minutes: 480
  faction_drift_per_week: {resources: {min: -0.03, max: 0.03}, military_power: {min: -0.01, max: 0.02}, reputation: {min: -2, max: 2}}
  offline_event_chance_per_week: {lod1: 0.4, lod2: 0.25, lod3: 0.1}
auto_advance:
  max_steps: 4
  max_minutes: 480
  npc_llm_per_step: 0
  interrupt_importance: 0.8
  interrupt_health_loss: 0.2
  engaging_actions: [TALK, ASK, SEARCH]
  hostile_actions: [ATTACK, STEAL]
  offer_events: [QUEST_OFFER, CONFRONTATION, SECRET_DISCLOSURE, BETRAYAL]
consistency: {strict: true, checks: [alive, location, inventory, knowledge, faction, time]}
reputation: {ranges: {global: {min: -100, max: 100}, faction: {min: -100, max: 100}}}
