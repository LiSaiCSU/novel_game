    constraints: {deadline_minutes: 4320}
    rewards: {relationship: {tie_gou: {trust: 8, affection: 5}}}
    failure_conditions: [deadline_passed]
    world_consequences:
      on_success: {advance_thread: thread_conscripts}
      on_failure: {tension: 4}
      if_player_refuses: {reassign_to: [luo_jiuniang], success_chance: 0.4}
    plot_thread: thread_conscripts

