  - key: lamp_ending_requires_both_lines
    name: 九灯结局需要同时点齐灯与拦下炸药
    scenario: main_story
    player:
      name: 测试玩家
      age: 30
      gender: unspecified
    fixtures:
      quests: {quest_light_the_nine: completed, quest_stop_the_blast: completed}
    assertions:
      - {path: endings.ending_lamps_answered.available, op: eq, expected: true}
      - {path: endings.ending_sold_the_lamps.available, op: eq, expected: false}
      - {path: endings.ending_walked_out_empty.available, op: eq, expected: false}
world:
  name: 寒鸦岭·离侯陵
  description: >
    民国二十三年深秋，晋陕交界的寒鸦岭。岭下埋着战国离国最后一位国君离厉侯的陵。
    当地世代传一句话——九枝灯不灭，寒鸦岭不塌。陵中九盏青铜连枝灯按定序分列九处，
    灯被强取或次序点错，山腹里那条水银暗河就会倒灌，陵、岭和岭上的镇子一起陷下去。
    十年前玩家的父亲带一队土夫子下过这座陵，只有瘸腿的陈老头爬了出来，从此装疯。
    如今靳绍衡旅长带兵进驻，强征民夫剥封土，限九日内炸开主墓道取走离侯玺换一批军火；
    上海掮客周麦臣带着买主的定金住进了骡马店；古物保管所的徐问卿只带来一纸公文和一箱拓片。
  start_location: mule_inn
  world_seed_default: hanya-1934
story:
  title: 寒鸦岭·九枝灯
  opening_location: mule_inn
  premise: >
    十年前，父亲从寒鸦岭寄回半张九枝灯图和一句“别来”；随后他带队下地，再没上来。
    这十年你靠玩家选择的门路吃饭，学会看土、看绳、看人如何把真话掺进假话里，也攒够了独自回岭的路费。
    如今靳部强征民夫剥封土，九天后要炸开主墓道。你赶到寒鸦镇时，先遇到的是查路条、涨店钱和一头不肯往军营方向走的骡子，
    然后才看见骡马店后院的新土与碎骨。你要找父亲，也要弄明白九盏灯为什么关系到整座山；但镇上没有谁会在第一顿饭就把十年前全告诉你。
  opening_blueprint:
    player_context: 交代父亲失踪后的十年、玩家所选门路能做什么、为何偏偏在九日倒计时开始时回来；主角是带着经验和目的来的成年人，不是被剧情牵着走的空壳。
    acts:
      - purpose: 先认识赶路的人
        must_show: [用一次检查绳结、土色或路条的具体动作表现玩家门路, 让半张灯图既是线索也是会招祸的东西, 交代路费与装备有限]
        comic_beat: 那头骡子见军号就拒绝迈步，主角最后不是靠威风而是用半块干饼和一句骂骡子听不懂的话谈成条件
      - purpose: 再认识活着的寒鸦镇
        must_show: [先写征夫告示、住店规矩和镇民如何在军队眼皮下过日子, 沈砚以看绳或看牲口的实际本事出场, 周麦臣用一次占便宜表现圆滑]
        comic_beat: 王婆酒把店钱、草料钱和“骡子夜里打呼噜吵客”的钱分开算，沈砚当面指出她昨天还说院里没有别的客
      - purpose: 新土把旧事掀开一道口
        must_show: [玩家发现封土新土和碎骨但不凭空认定身份, 查夜压力逼近, 只让一个十年前的细节露头而不是让所有人轮流坦白]
        comic_beat: 骨头、亡者和父亲失踪不作为笑料；此前的讨价还价到枪托敲门时立刻收住
    humor_rule: 笑点来自穷日子里的算计、牲口脾气和几个人互相拆台；不写网络梗，不拿尸骨、民夫伤亡、成瘾或胁迫取乐。
    choice_gate: 玩家知道自己学过什么、为何带着半张图回来、九日倒计时从何而来，并已经看见沈砚、周麦臣和王婆酒各自一次可验证的做事方式；第一次选择只处理眼前查夜或图纸安全，不要求凭空决定信谁。
  starter_items:
    - {key: half_lamp_map, quantity: 1}
    - {key: wind_lantern, quantity: 1}
    - {key: fire_stick, quantity: 1}
    - {key: dayang, quantity: 8}
  player_template:
    constraints: {minimum_age: 18, maximum_age: 55}
    properties: {hill_status: outsider}
  relationship_boundaries: >
    可发展的关系限于成年人之间，且必须建立在共同经历与明确表达之上。
    不写露骨性描写，不把胁迫、控制、债务或救命之恩美化成感情；被拒绝之后不得反复施压。
  endings:
    - key: ending_lamps_answered
      type: other
      title: 九灯归位
      priority: 95
      epilogue: >
        第九盏灯亮起来的时候，甬道里那股一直往人后颈上吹的阴风忽然停了。
        暗河的水银退回河床，像一条被喂饱的兽重新卧下。你们从鬼路爬出山口时，
        靳部的炸药还堆在封土上，没人再敢点。寒鸦岭还在原地，镇子还在原地，
        岭下那些名字终于有人肯写下来。你把半张灯图烧了——它已经不需要有人再找了。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_light_the_nine.status]}, completed]}
          - {op: eq, args: [{op: get, args: [quests.quest_stop_the_blast.status]}, completed]}
    - key: ending_bones_carried_home
      type: bond
      title: 背他上来
      priority: 88
      epilogue: >
        父亲剩下的不多，一副骨头、一只停在丑时三刻的怀表、半张被水泡烂的灯图。
        你把他背出鬼路的时候天正好亮，陈瘸子在洞口站着，一句话没说，只把拐扔了。
        十年前他喊的那一声“割”，你终于听懂了：那不是抛弃，是他在下面用最后一口气
        把上面的人推出去。你没有把这句话告诉任何人，只在坟前压了一块山里的石头。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_recover_father.status]}, completed]}
          - {op: eq, args: [{op: get, args: [quests.quest_get_out_alive.status]}, completed]}
    - key: ending_hill_kept
      type: other
      title: 山还在，玺不走
      priority: 78
      epilogue: >
        炸药最终没有响。徐问卿那张自己刻的关防终究派上了用场——不是因为它真，
        而是因为在场所有人都需要一张纸来收场。离侯玺被封进箱子押去省城，
        路上会不会被换掉，谁也不敢保证。但寒鸦岭没塌，封土下面那七个人被起了出来，
        名字一个一个写进了民夫册子。你留在岭上看了三天雪，才下山。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_stop_the_blast.status]}, completed]}
          - {op: eq, args: [{op: get, args: [quests.quest_seal_decision.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_light_the_nine.status]}, completed]}
    - key: ending_sold_the_lamps
      type: other
      title: 灯换了钱
      priority: 45
      epilogue: >
        周麦臣的箱子装得很整齐，九枝灯用棉花裹着，一枝一格。他数给你的大洋是真的，
        码头上的船也是真的。船开出去第三天，你听见有人说寒鸦岭塌了半边，
        压住了岭下两个村子。你没有回头，也没有再点过灯——夜里睡觉必须留一盏，
        否则总有水声从枕头底下过。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_seal_decision.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_stop_the_blast.status]}, completed]}
    - key: ending_buried_with_it
      type: other
      title: 陪它一起塌
      priority: 30
      epilogue: >
        第九日午时，封土上的炸药响了三声。第四声不是炸药，是山自己的声音。
        水银从暗渠一路顶上来，把甬道灌成一条亮得吓人的河。你最后看见的是灯厅顶上
        那圈没点着的铜枝，像九只没睁开的眼睛。寒鸦岭陷下去的时候，
        岭上没有一个人来得及喊出第二个字。
      # world.minute is the absolute world clock. 开局 405720（民国23年10月12日 擦黑），
      # 第九日午时 = 405720 + 12960 = 418680。
      condition:
        op: and
        args:
          - {op: gte, args: [{op: get, args: [world.minute]}, 418680]}
          - {op: ne, args: [{op: get, args: [quests.quest_stop_the_blast.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_get_out_alive.status]}, completed]}
    - key: ending_walked_out_empty
      type: independent
      title: 空手下岭
      priority: 20
      epilogue: >
        你什么也没带走：没有玺，没有灯，没有骨头，连那半张图都在暗渠里泡烂了。
        罗九娘替你在骡子上绑好行李，说了句“活着就不算亏”。下岭第一个岔路口，
        你回头看了一眼寒鸦岭。它还立在那儿，像十年前一样黑，像十年前一样什么都不说。
        这一次，至少你知道自己是走下来的，不是被人抬下来的。
      condition:
        op: and
        args:
          - {op: eq, args: [{op: get, args: [quests.quest_get_out_alive.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_light_the_nine.status]}, completed]}
          - {op: ne, args: [{op: get, args: [quests.quest_recover_father.status]}, completed]}
    - key: ending_nine_days_over
      type: other
      title: 第九日之后
      priority: 5
      hidden_until_available: false
      epilogue: >
        九天到了。无论你查到多少、拦下多少、又留下多少没做完的事，
        寒鸦岭都不会再等下一个人。往后镇上说起这件事，版本会有很多个，
        每个版本里都有一个从外面回来的人，和一盏没人说得清点没点着的灯。
      condition: {op: gte, args: [{op: get, args: [world.minute]}, 418680]}
narrative_style:
  language: 中文
  person: 第二人称
  tense: 现在时
  tone: 有黑色生活趣味的民国盗墓冒险，粗粝但不故作阴沉；靠手上活计、人物算计和九日时限制造紧张，笑料来自活人的穷讲究，地下凶险遵守物理规律而非鬼怪
  target_length: 1800
  avoid_phrases:
    - 嘴角勾起一抹弧度
    - 眼中闪过一丝异色
    - 空气仿佛凝固
    - 心里微沉
    - 淡淡地说道
    - 目光扫过
    - 又落回
    - 喉结动了动
    - 一时却又抓不住头绪
    - 总觉得哪里有些不对
    - 风卷着
    - 冷汗涔涔
    - 汗毛倒竖
    - 头皮发麻
    - 阴风阵阵
  phrase_repeat_window: 12
  phrase_repeat_threshold: 2
  guidance:
    - 每一段至少推进以下之一——九日倒计时、灯序线索、父亲的下落、某个人的动机，或一个不可逆的后果
    - 地下的危险要讲物理——缺氧、塌方、水银蒸气、绳子长度、灯油还剩多少，而不是靠“不祥的预感”
    - 写具体的手上活计：怎么下铲、怎么打盗洞、怎么试毒、怎么系绳结、怎么护住灯不被穿堂风吹灭
    - 每个人都在为自己的活路算账；没有纯粹的好人和坏人，但有明确的底线和背叛
    - 不写鬼神显灵。所有看起来像鬼的东西，最后都要能被一个具体的解释接住
    - 开场三段内最多抛出两个核心疑问，不能让人物排队交代秘密；十年前的真相要靠查证逐层打开
    - 紧张之间允许短促的讨价还价、牲口脾气和熟人拆台，但尸骨、民夫与成瘾不作笑料
    - 少写烟头、眼神、停顿和“他没回答”；人物拒绝回答时必须改做一件能暴露立场的具体事情
