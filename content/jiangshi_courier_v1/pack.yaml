genre: jiangshi_comedy
version: 1.0.0
engine_min_version: 0.2.0
primary_progression_key: agency
attribute_definitions:
- key: composure
  label: 定力
  type: number
- key: investigation
  label: 调查
  type: number
- key: survival
  label: 应变
  type: number
- key: persuasion
  label: 交涉
  type: number
resource_definitions:
- key: health
  label: 状态
  minimum: 0
  maximum: 100
  default: 100
- key: clue
  label: 线索
  minimum: 0
  maximum: 100
  default: 20
- key: resolve
  label: 意志
  minimum: 0
  maximum: 100
  default: 65
- key: danger
  label: 风险
  minimum: 0
  maximum: 100
  default: 25
progression_definitions:
